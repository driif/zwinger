name: Bundle check

# Builds the app bundle like a release, with no tag and no GitHub release, and checks the adaptive icon.
on:
  workflow_dispatch:
    inputs:
      actool_only:
        description: Run only the actool probe on the adaptive icon (no app build)
        type: boolean
        default: false
      runner:
        description: Runner image
        type: string
        default: macos-26

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Xcode 26
        run: |
          ls -d /Applications/Xcode*
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      # Compiles the .icon with the same actool arguments as tauri-bundler (crates/tauri-bundler/src/bundle/macos/icon.rs).
      - name: actool probe
        run: |
          xcodebuild -version
          sw_vers
          actool --version --output-format human-readable-text
          # tauri-bundler compiles in a tempfile dir, which is hidden (.tmpXXXXXX).
          work=$(mktemp -d "${RUNNER_TEMP}/.tmpXXXXXX")
          cp -R src-tauri/icons/zwinger.icon "$work/Icon.icon"
          mkdir "$work/out"
          set +e
          MACOSX_DEPLOYMENT_TARGET=14.0 actool "$work/Icon.icon" --compile "$work/out" --output-format human-readable-text --notices --warnings \
            --output-partial-info-plist "$work/out/assetcatalog_generated_info.plist" --app-icon Icon \
            --include-all-app-icons --accent-color AccentColor --enable-on-demand-resources NO \
            --development-region en --target-device mac --minimum-deployment-target 26.0 --platform macosx
          echo "actool exit: $?"
          set -e
          ls -la "$work/out"
          cat "$work/out/assetcatalog_generated_info.plist" || true
          test -f "$work/out/Assets.car"
          assetutil --info "$work/out/Assets.car" | head -60
      - if: ${{ !inputs.actool_only }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: ${{ !inputs.actool_only }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: ${{ !inputs.actool_only }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - if: ${{ !inputs.actool_only }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - if: ${{ !inputs.actool_only }}
        run: pnpm install --frozen-lockfile
      - if: ${{ !inputs.actool_only }}
        run: bash scripts/fetch-pi.sh
      - if: ${{ !inputs.actool_only }}
        run: pnpm tauri build --bundles app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - if: ${{ !inputs.actool_only }}
        run: bash scripts/check-adaptive-icon.sh src-tauri/target/release/bundle/macos/zwinger.app
