name: Bundle check

# Builds the app bundle like a release, with no tag and no GitHub release, and checks the adaptive icon.
on:
  workflow_dispatch:
    inputs:
      actool_only:
        description: Check only the adaptive icon (bundle a stub binary, no Rust build)
        type: boolean
        default: false
      runner:
        description: Runner image
        type: string
        default: macos-26

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Xcode 26
        run: |
          ls -d /Applications/Xcode*
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
          sw_vers
      # Same steps as release.yml: compile the adaptive icon before the Rust build.
      - name: Compile the adaptive icon
        run: echo "ICON_CONFIG=$(bash scripts/compile-adaptive-icon.sh)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: ${{ !inputs.actool_only }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - if: ${{ !inputs.actool_only }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch-pi.sh
      # Bundles a stub binary, so tauri-bundler handles the icon as in a release, without the Rust build.
      - name: tauri bundle with a stub binary
        if: ${{ inputs.actool_only }}
        run: |
          mkdir -p src-tauri/target/release
          echo 'int main(void) { return 0; }' | clang -x c - -o src-tauri/target/release/zwinger
          pnpm tauri bundle --bundles app -v --config "$ICON_CONFIG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - if: ${{ !inputs.actool_only }}
        run: pnpm tauri build --bundles app -v --config "$ICON_CONFIG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: bash scripts/check-adaptive-icon.sh src-tauri/target/release/bundle/macos/zwinger.app
