[package]
name = "zwinger"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zwinger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
microsandbox = { version = "0.7.8", features = ["embed-binaries"] }
tokio = { version = "1.54.0", features = ["full"] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
dirs = "7.0.0"
tauri-plugin-dialog = "2"
keyring = { version = "3.6.3", features = ["apple-native"] }
rustix = { version = "1.1.5", features = ["fs"] }
psl = "2.1.244"
reqwest = { version = "0.13.5", features = ["json"] }
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.10.9"
base64 = "0.22.1"
toml = "1.1.8"
tauri-plugin-updater = "2"
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1", "http2", "server", "server-auto"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
tower-service = "0.3.3"
bytes = "1.12.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
lru = "0.19.0"
subtle = "2.6.1"
libc = "0.2"
portable-pty = "0.9.0"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# A task panic must not end the process: the UI shows the Reload screen.
panic = "unwind"
strip = true
